name: CI

on:
  push:
    branches: [main]
  pull_request:

# Žádný job nic nezapisuje zpět do repa (jen checkout + build/test) — GITHUB_TOKEN proto
# jen ke čtení, viz CodeQL "missing-workflow-permissions".
permissions:
  contents: read

jobs:
  version:
    name: Verze a changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Ověří, že VERSION/CHANGELOG.md a pět generovaných výstupů (backend/build.gradle,
      # frontend/package.json, mobile/app/build.gradle.kts, changelog.generated.ts,
      # assets/changelog.json) souhlasí — stejný vzor jako `npm run codegen` +
      # `git diff --exit-code` u frontendu níž (docs/vydani.md, "Verzování a vydání").
      - run: node tools/version/sync.mjs
      - run: git diff --exit-code

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # `build` spouští i testy (unit, bez DB — spring-boot-docker-compose je jen
      # developmentOnly a žádný test nestartuje Spring context) a ověří, že se Liquibase
      # changelogy parsují.
      - run: ./gradlew build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Přegeneruje typy ze schema.graphqls (npm run codegen, viz codegen.ts) a ověří, že
      # commitnutý výstup v src/app/models/generated/ pořád sedí — jinak backend a frontend
      # potichu rozejdou kontrakt (viz historie duplicitně definovaného PriceKind/MULTIBUY).
      - run: npm run codegen
      - run: git diff --exit-code src/app/models/generated
      - run: npm test -- --watch=false
      - run: npm run build

  mobile:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # testDebugUnitTest/lintDebug dřív běžely jen lokálně — lint teď navíc hlídá
      # MissingTranslation/ExtraTranslation/MissingQuantity (docs/lokalizace.md).
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
