spring:
  application:
    name: kvalita-a-cena

  # Lokální Postgres z compose.yaml v kořeni repozitáře. Boot si ho přes
  # spring-boot-docker-compose sám nastartuje (developmentOnly), pokud ještě neběží.
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  datasource:
    url: jdbc:postgresql://localhost:5437/kvalitaacena
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate # schéma spravuje výhradně Liquibase
    # Pro GraphQL záměrně true (Spring Boot default): GraphQL vyhodnocuje vnořená pole
    # (Product.brand, Product.category, ...) jako samostatné data fetchery PO návratu z
    # kořenového @QueryMapping, mimo jeho transakci — bez otevřené session přes celý request
    # by lazy JPA vztahy padaly na LazyInitializationException. U REST endpointů (auth) by
    # bylo bezpečnější open-in-view=false, ale je to jedna appka s jedním datasourcem.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # V souladu s app.media.max-upload-bytes níž — nahrávaný soubor navíc kontroluje
      # ImageProcessingService (magic bytes, rozměry), tohle je jen hrubá pojistka na úrovni
      # kontejneru (MediaController, jediný multipart endpoint v appce).
      max-file-size: 8MB
      max-request-size: 8MB

  graphql:
    graphiql:
      enabled: true # jen pro dev profil, viz application-local.yml
    schema:
      introspection:
        enabled: true # v produkci vypnout (docs/soukromi.md, docs/datovy-model.md)

  mail:
    host: localhost
    port: 1025 # MailHog/Mailpit pro lokální vývoj — viz app.auth.otp.mail-enabled níže

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # V etapě 1 se OTP loguje do konzole (app.auth.otp.mail-enabled=false), SMTP neběží.
      enabled: false

logging:
  level:
    cz.kvalitacena: DEBUG

app:
  jwt:
    # Jen pro lokální vývoj — v produkci povinně přes proměnnou prostředí JWT_SECRET.
    secret: ${JWT_SECRET:VGVudG9LbGljTmVuaVByb1Byb2R1a2NpUG91emVFbnZWYXJKV1RTZWNyZXQ=}
    access-token-ttl: PT10M
  security:
    # HMAC-SHA256 pepper pro email_hash a AES-256-GCM klíč pro email_enc (docs/soukromi.md).
    # Oba jen pro lokální vývoj — v produkci povinně přes proměnné prostředí, mimo databázi
    # (viz application-prod.yml, kde nemají fallback a appka bez nich nenastartuje).
    email-hash-pepper: ${EMAIL_HASH_PEPPER:3h1brFxufkFk4TeZkGz/O9SyCbfC3tSMTGvC49lRzMs=}
    email-enc-key: ${EMAIL_ENC_KEY:u1h1L4+4CDYrvpImNDJzSnpXwUOHW5OvMHmd+THqhzQ=}
    # Refresh cookie jde přes HTTP jen v dev — v produkci nastaveno na true (application-prod.yml).
    cookie-secure: false
    # CORS (SecurityConfig) — dev Angular server. Produkční hodnota je v application-prod.yml;
    # mobil se CORS netýká (nativní klient).
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  auth:
    otp:
      # V MVP (etapa 1) se kód místo odesílání e-mailem loguje do konzole (viz OtpService).
      mail-enabled: false
      # Použije se jen když se mail-enabled lokálně přepne na true (např. proti Mailpit) —
      # v produkci vždy z SMTP_FROM, viz application-prod.yml.
      mail-from: "KvalitaACena <dev@example.com>"
      code-ttl: PT10M
      resend-cooldown: PT1M
      max-attempts: 5
    refresh-token:
      web-ttl: P30D
      android-ttl: P180D
      reuse-grace-period: PT30S
  history:
    # Odstupňování přístupu (docs/reputace.md, T0 vs. T1) — anonymní okno je v etapě 1 vědomě
    # velkorysejší než dokument uvádí (7 dní): studený start je větší riziko než parazitování
    # na datech. Odchylka je poznamenaná i v docs/reputace.md.
    max-days: 730
    anonymous-max-days: 90
  quality:
    # Pod tímto počtem hodnocení klienti známku zobrazí ztlumeně jako "orientační" — obdoba
    # pravidla n_eff < 2 u cen (docs/reputace.md).
    min-ratings-for-badge: 3
  client:
    # Nejnižší versionCode mobilní appky, který backend ještě obsluhuje (ClientVersionFilter,
    # docs/vydani.md) — vydáním APK zamrzne GraphQL kontrakt, starším klientům v terénu by
    # pozdější breaking změna schématu jinak spadla na nesrozumitelnou chybu. 0 = kontrola
    # vypnutá (etapa 1, žádné APK ještě není v terénu).
    min-android-version: 0
  privacy:
    # docs/soukromi.md, "Retence vazby observace → uživatel: 180 dní" (PseudonymizationService).
    pseudonymization-days: 180
  legal:
    # docs/podminky-uziti.md, docs/zasady-ochrany-osobnich-udaju.md — bump při každé věcné
    # změně (ne při překlepu). OtpService.verifyOtp ji zapisuje k nové registraci.
    terms-version: "1"
  catalog:
    # Zakládání katalogu (docs/reputace.md, "Limity patří do konfigurace") — velkoryse jako
    # ostatní limity v MVP, studený start je větší riziko než zneužití.
    max-stores-per-day: 20
    max-products-per-day: 20
    # Kolik různých přispěvatelů musí bezkódovou (DRAFT) položku / PENDING obchod potvrdit,
    # než se stanou ACTIVE.
    draft-confirmations: 3
  trust:
    # Práh důvěry autora pro okamžité zveřejnění nového záznamu (docs/reputace.md, etapa-1
    # aproximace úrovně T2) — pod prahem vidí nový obchod/zboží jen autor, dokud ho nepotvrdí
    # draft-confirmations jiných přispěvatelů.
    min-account-age-days: 7
    min-observations: 5
  moderation:
    # Kolik různých nahlášení skryje záznam a pošle ho k přezkumu (docs/reputace.md,
    # "Nesouhlas se vyjadřuje k faktu, ne k člověku").
    flags-to-hide: 3
    # Fotka je nejrizikovější uživatelský obsah — jedno nahlášení stačí (docs/reputace.md).
    photo-flags-to-hide: 1
  feedback:
    # Zpětná vazba od uživatele appky (docs/nasazeni.md, "Než pozvat první lidi") — funguje i
    # anonymně, prahy proto velkoryse jako zbytek MVP limitů.
    max-message-length: 2000
    max-diagnostics-length: 8000
    max-per-day-per-ip: 20
    max-per-day-per-user: 20
  media:
    # Adresář na disku mimo pg_dump (docs/datovy-model.md) — v produkci mimo repozitář,
    # zálohuje se nezávisle na databázi.
    root: ./data/media
    max-upload-bytes: 8388608
    # Pojistka proti "decompression bomb" — kontroluje se PŘED dekódováním (ImageProcessingService).
    max-pixels: 50000000
    max-dimension: 1600
    thumbnail-dimension: 400
    max-photos-per-record: 5
    max-uploads-per-day: 30
    # Atribuce se od 2026-08-09 nečte odsud, ale z messages/attribution*.properties
    # (lokalizovaná, docs/lokalizace.md) — viz Messages, MediaService.toPhoto.
  external:
    open-food-facts:
      enabled: true
      base-url: https://world.openfoodfacts.org
      product-url-template: "https://cz.openfoodfacts.org/product/{barcode}"
      # OFF vyžaduje identifikovatelný User-Agent; v produkci se kontakt přebije env proměnnou.
      user-agent: "KvalitaACena/0.2.0 (dev@example.com)"
      timeout: PT5S
      positive-cache-ttl: P7D
      negative-cache-ttl: P1D
      max-requests-per-minute: 15
    nominatim:
      # Usage policy Nominatimu vyžaduje identifikovatelný User-Agent — v produkci nahradit
      # reálným kontaktem (viz https://operations.osmfoundation.org/policies/nominatim/).
      base-url: https://nominatim.openstreetmap.org
      # V produkci nahradit reálným kontaktním e-mailem.
      user-agent: "KvalitaACena/0.1 (dev@example.com)"
      timeout: PT5S
      cache-ttl: P1D
    ares:
      # Veřejný rejstřík ekonomických subjektů ČR — ne ODbL, jen předvyplnění formuláře.
      base-url: https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty
      timeout: PT5S
    nbs:
      # Národní banka Srbska — jediný zdroj kurzu pro RSD, ČNB ho na lístku nemá (ověřeno
      # živě, viz plán expanze). Na rozdíl od ČNB vyžaduje registraci a API klíč — bez
      # nastaveného NBS_API_KEY NbsRateSource jen vrací prázdno (stejná odolnost jako u
      # výpadku ČNB), RSD kurz prostě chybí, appka nespadne (docs/lokalizace.md).
      base-url: https://webappcenter.nbs.rs/ExchangeRateWebService
      api-key: ${NBS_API_KEY:}
      timeout: PT10S

  i18n:
    default-locale: cs
    supported-locales: [cs, sk, en, pl, de]
    default-country: CZ
    # Rozšíření o dalších 13 zemí (plán expanze, docs/lokalizace.md "Country selector v UI") —
    # nové země bez vlastního jazyka míří na `en` (žádný literál v kódu se tím nemění, jen
    # řádek tady + CHECK constraint na currency, viz migrace 2026-08-17/01-countries.yaml).
    # DE/AT/CH už na `de` míří, protože `de` je od etapy 2 podporovaný jazyk appky.
    country-currency:
      CZ: CZK
      SK: EUR
      PL: PLN
      DE: EUR
      AT: EUR
      FR: EUR
      ES: EUR
      IT: EUR
      HR: EUR
      SI: EUR
      BG: EUR
      HU: HUF
      RO: RON
      GB: GBP
      CH: CHF
      RS: RSD
    country-locale:
      CZ: cs
      SK: sk
      PL: pl
      DE: de
      AT: de
      FR: en
      ES: en
      IT: en
      HR: en
      SI: en
      BG: en
      HU: en
      RO: en
      GB: en
      CH: de
      RS: en

  fx:
    enabled: true
    base-url: https://api.cnb.cz/cnbapi
    timeout: PT10S
    # ČNB publikuje v pracovní dny cca 14:30 SEČ — běžíme s rezervou (docs/lokalizace.md).
    cron: "0 15 15 * * *"
    zone: Europe/Prague
    # Co se stahuje. CZK tu NENÍ — je to pivot, kurz CZK/CZK ČNB nepublikuje. HUF/RON/GBP/CHF
    # jdou z ČNB stejně jako EUR/PLN; RSD jde výhradně z NbsRateSource (viz app.external.nbs).
    tracked-currencies: [EUR, PLN, USD, HUF, RON, GBP, CHF, RSD]
    # Do čeho appka smí PŘEPOČÍTAT zobrazení. USD je navíc oproti app.i18n.country-currency —
    # je to referenční měna pro srovnání napříč zeměmi, cenu v ní zapsat nejde (CurrencyResolver).
    display-currencies: [CZK, EUR, PLN, USD, HUF, RON, GBP, CHF, RSD]
    cache-ttl: PT6H
    max-backfill-years: 5
