# 02-recompute-queue-attempts.yaml — počítadlo neúspěšných pokusů ve frontě přepočtu.
#
# Přepočet buňky, který vyhodí výjimku, dřív shodil celou dávku a protože se bere vždy
# nejstarších 200 položek, padala pak stejná dávka každých 5 s donekonečna — agregace stála
# pro všechny. PriceAggregationService teď počítá buňku ve vlastní transakci a položce, která
# selže, zvedne `attempts`; po app.aggregation.queue-max-attempts ji přestane brát. Zůstane
# v tabulce s processed_at IS NULL jako stopa pro provozovatele.
databaseChangeLog:
  - changeSet:
      id: 2026-11-15-02-recompute-queue-attempts
      author: Petr F.
      changes:
        - sql:
            sql: ALTER TABLE agg.recompute_queue ADD COLUMN attempts INT NOT NULL DEFAULT 0;
      rollback:
        - sql:
            sql: ALTER TABLE agg.recompute_queue DROP COLUMN IF EXISTS attempts;
