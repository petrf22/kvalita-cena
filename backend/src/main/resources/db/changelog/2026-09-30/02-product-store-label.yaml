# 02-product-store-label.yaml — „Názvy na účtenkách": označení zboží, jak ho tiskne obchod,
# → katalogová položka (docs/rozvoj.md, „Mapování obchodního označení zboží na katalogovou
# položku"; docs/datovy-model.md, „Účtenky").
#
# Samostatná tabulka, ne další význam naroubovaný na core.product_alias: alias je globální
# pro produkt, míří do veřejného našeptávače a jeho unikátnost (product_id, name) je obrácená.
# Tady jde párování označení → zboží, takže jedno označení smí v jednom rozsahu ukazovat
# nejvýš na jednu položku — unikátnost (label_norm, rozsah) bez product_id.
#
# Rozsah vzorem chk_product_catalog_scope: právě jeden z chain_id/store_id. COALESCE v indexu
# ze stejného důvodu jako uq_product_code_code_type_chain (NULL by jinak unikátnost obešel).
databaseChangeLog:
  - changeSet:
      id: 2026-09-30-02-product-store-label
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE TABLE core.product_store_label (
                id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                product_id   BIGINT NOT NULL REFERENCES core.product(id) ON DELETE CASCADE,
                label        VARCHAR(200) NOT NULL,
                label_norm   TEXT GENERATED ALWAYS AS (core.norm_label(label)) STORED,
                chain_id     BIGINT REFERENCES core.retail_chain(id) ON DELETE CASCADE,
                store_id     BIGINT REFERENCES core.store(id) ON DELETE CASCADE,
                status       VARCHAR(10) NOT NULL DEFAULT 'PENDING',
                created_at   TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                activated_at TIMESTAMPTZ,
                last_seen_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT chk_product_store_label_scope CHECK ((chain_id IS NULL) <> (store_id IS NULL)),
                CONSTRAINT chk_product_store_label_status CHECK (status IN ('PENDING','ACTIVE')),
                CONSTRAINT chk_product_store_label_length CHECK (char_length(btrim(label)) BETWEEN 2 AND 200)
              );
              CREATE UNIQUE INDEX uq_product_store_label_scope ON core.product_store_label
                (label_norm, COALESCE(chain_id, 0), COALESCE(store_id, 0));
              CREATE INDEX idx_product_store_label_product ON core.product_store_label (product_id);
              CREATE INDEX idx_product_store_label_trgm ON core.product_store_label
                USING gin (label_norm gin_trgm_ops);

              CREATE TABLE core.product_store_label_confirmation (
                id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                label_id   BIGINT NOT NULL REFERENCES core.product_store_label(id) ON DELETE CASCADE,
                -- NULL po 180 dnech nebo smazání účtu (docs/soukromi.md), stejně jako u aliasu.
                user_id    BIGINT REFERENCES auth.app_user(id) ON DELETE SET NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE UNIQUE INDEX uq_product_store_label_confirmation_user
                ON core.product_store_label_confirmation (label_id, user_id) WHERE user_id IS NOT NULL;
              CREATE INDEX idx_product_store_label_confirmation_user
                ON core.product_store_label_confirmation (user_id, created_at) WHERE user_id IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS core.product_store_label_confirmation;
              DROP TABLE IF EXISTS core.product_store_label;
