# 01-receipt.yaml — naskenované účtenky (docs/datovy-model.md, „Účtenky"; soukromí
# docs/soukromi.md, „Účtenky").
#
# Tři tabulky: hlavička (core.receipt), části obrázku v pořadí (core.receipt_image) a vytěžené
# řádky (core.receipt_line). Obrázky ZÁMĚRNĚ nejsou v core.media — ta je veřejná a dlouze
# cachovaná, účtenka je soukromý přehled nákupu, který vidí jen vlastník.
#
# Dvě nezávislé osy stavu na hlavičce: processing_status = co udělal stroj (worker, docs/ai.md),
# review_status = kam došel uživatel s párováním. Jedna osa by míchala „stroj ještě neběžel"
# s „uživatel ještě nepotvrdil" a notifikace by neměla z čeho poznat, že je co dělat.
#
# core.norm_label je norm_text zbavený interpunkce — zkratky z účtenky se mezi OCR běhy liší
# právě jí („TUK.ROHLIK" vs. „TUK. ROHLIK"), párování přes přesnou shodu by na tom selhávalo.
databaseChangeLog:
  - changeSet:
      id: 2026-09-30-01-norm-label
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE FUNCTION core.norm_label(t TEXT) RETURNS TEXT
                LANGUAGE sql IMMUTABLE STRICT PARALLEL SAFE AS
                $body$ SELECT btrim(core.norm_text(regexp_replace($1, '[^[:alnum:]]+', ' ', 'g'))) $body$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS core.norm_label(TEXT);

  - changeSet:
      id: 2026-09-30-01-receipt
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE TABLE core.receipt (
                id                 BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                owner_user_id      BIGINT NOT NULL REFERENCES auth.app_user(id) ON DELETE CASCADE,
                processing_status  VARCHAR(16) NOT NULL DEFAULT 'QUEUED',
                review_status      VARCHAR(12) NOT NULL DEFAULT 'PENDING',
                consent_version    INTEGER NOT NULL,
                archive_consent    BOOLEAN NOT NULL DEFAULT FALSE,
                captured_at        TIMESTAMPTZ,
                store_name_raw     VARCHAR(200),
                store_address_raw  VARCHAR(300),
                store_ico_raw      VARCHAR(20),
                purchased_at       TIMESTAMPTZ,
                total_amount       NUMERIC(10,2),
                currency           VARCHAR(3),
                store_id           BIGINT REFERENCES core.store(id) ON DELETE SET NULL,
                suggested_store_id BIGINT REFERENCES core.store(id) ON DELETE SET NULL,
                processed_at       TIMESTAMPTZ,
                seen_at            TIMESTAMPTZ,
                archived_at        TIMESTAMPTZ,
                images_deleted_at  TIMESTAMPTZ,
                created_at         TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT chk_receipt_processing_status CHECK (processing_status IN
                  ('QUEUED','PROCESSING','PROCESSED','NOT_A_RECEIPT','UNREADABLE','FAILED')),
                CONSTRAINT chk_receipt_review_status CHECK (review_status IN ('PENDING','IN_PROGRESS','DONE')),
                CONSTRAINT chk_receipt_currency CHECK (currency IS NULL OR currency ~ '^[A-Z]{3}$')
              );
              CREATE INDEX idx_receipt_owner ON core.receipt (owner_user_id, created_at DESC);
              -- Denní retenční job hledá zpracované účtenky s obrázky (docs/soukromi.md).
              CREATE INDEX idx_receipt_image_retention ON core.receipt (processed_at)
                WHERE images_deleted_at IS NULL;

              CREATE TABLE core.receipt_image (
                id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                receipt_id   BIGINT NOT NULL REFERENCES core.receipt(id) ON DELETE CASCADE,
                seq          SMALLINT NOT NULL,
                storage_key  VARCHAR(100) NOT NULL,
                width        INTEGER NOT NULL,
                height       INTEGER NOT NULL,
                bytes        INTEGER NOT NULL,
                sha256       BYTEA NOT NULL,
                CONSTRAINT uq_receipt_image_seq UNIQUE (receipt_id, seq)
              );

              CREATE TABLE core.receipt_line (
                id               BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                receipt_id       BIGINT NOT NULL REFERENCES core.receipt(id) ON DELETE CASCADE,
                line_no          SMALLINT NOT NULL,
                label_raw        VARCHAR(200) NOT NULL,
                label_norm       TEXT GENERATED ALWAYS AS (core.norm_label(label_raw)) STORED,
                internal_code    VARCHAR(40),
                quantity         NUMERIC(10,3),
                quantity_unit    VARCHAR(4) NOT NULL DEFAULT 'PCS',
                unit_price       NUMERIC(10,2),
                line_total       NUMERIC(10,2),
                discount_amount  NUMERIC(10,2),
                price_kind_guess VARCHAR(12) NOT NULL DEFAULT 'REGULAR',
                status           VARCHAR(10) NOT NULL DEFAULT 'UNMATCHED',
                product_id       BIGINT REFERENCES core.product(id) ON DELETE SET NULL,
                match_source     VARCHAR(12),
                observation_id   BIGINT REFERENCES core.price_observation(id) ON DELETE SET NULL,
                skip_reason      VARCHAR(30),
                updated_at       TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_receipt_line_no UNIQUE (receipt_id, line_no),
                CONSTRAINT chk_receipt_line_unit CHECK (quantity_unit IN ('PCS','KG','L')),
                CONSTRAINT chk_receipt_line_status CHECK (status IN ('UNMATCHED','SUGGESTED','MATCHED','IGNORED')),
                CONSTRAINT chk_receipt_line_match_source CHECK (match_source IS NULL OR match_source IN
                  ('CODE','LABEL','USER','NEW_PRODUCT')),
                CONSTRAINT chk_receipt_line_price_kind CHECK (price_kind_guess IN
                  ('REGULAR','PROMO','CLUB_CARD','CLEARANCE','MULTIBUY')),
                -- Spárovaný nebo navržený řádek bez zboží je nesmysl, který by UI neumělo zobrazit.
                CONSTRAINT chk_receipt_line_product CHECK (status NOT IN ('SUGGESTED','MATCHED') OR product_id IS NOT NULL)
              );
              CREATE INDEX idx_receipt_line_product ON core.receipt_line (product_id) WHERE product_id IS NOT NULL;
              -- Pozdější párování (docs/rozvoj.md) hledá nespárované řádky podle označení.
              CREATE INDEX idx_receipt_line_unmatched_label ON core.receipt_line (label_norm)
                WHERE status = 'UNMATCHED';
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS core.receipt_line;
              DROP TABLE IF EXISTS core.receipt_image;
              DROP TABLE IF EXISTS core.receipt;
