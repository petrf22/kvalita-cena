# 06-receipt-client-upload-id.yaml — klíč idempotence nahrání účtenky (docs/datovy-model.md,
# „Účtenky").
#
# Mobil posílá účtenku z fronty přes WorkManager a po výpadku spojení upload opakuje. Server
# ale mohl účtenku uložit dřív, než odpověď dorazila — bez klíče by vznikla druhá identická
# účtenka a sebrala další místo z denního limitu. Klient posílá id položky fronty (UUID),
# stejné při každém opakování; web upload automaticky neopakuje a klíč neposílá.
databaseChangeLog:
  - changeSet:
      id: 2026-09-30-06-receipt-client-upload-id
      author: Petr F.
      changes:
        - sql:
            sql: |
              ALTER TABLE core.receipt ADD COLUMN client_upload_id UUID;
              CREATE UNIQUE INDEX uq_receipt_owner_client_upload
                ON core.receipt (owner_user_id, client_upload_id)
                WHERE client_upload_id IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS core.uq_receipt_owner_client_upload;
              ALTER TABLE core.receipt DROP COLUMN IF EXISTS client_upload_id;
