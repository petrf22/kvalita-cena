# 04-ai-receipt-job.yaml — schéma `ai` a fronta vytěžení účtenek pro pull worker (docs/ai.md,
# „Kde to běží" a „Účtenky").
#
# Vlastní schéma mimo core/agg ze stejného důvodu jako off/osm: čistý export
# (pg_dump --schema=core --schema=agg) nemá obsahovat strojové odhady, které se dají
# přepočítat jindy jinak. Syrový výstup modelu (raw_text, extraction) zůstává tady; do
# core.receipt_line jde až normalizovaný návrh.
#
# Na rozdíl od agg.recompute_queue úlohy nebere scheduler uvnitř backendu, ale vzdálený
# worker přes HTTPS — proto lease (lease_until) místo processed_at jako jediné značky: worker
# může uprostřed práce zmizet (vypnutý PC) a úloha se musí vrátit do fronty sama.
databaseChangeLog:
  - changeSet:
      id: 2026-09-30-04-ai-schema
      author: Petr F.
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS ai;
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS ai CASCADE;

  - changeSet:
      id: 2026-09-30-04-ai-receipt-job
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE TABLE ai.receipt_job (
                id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                receipt_id   BIGINT NOT NULL UNIQUE REFERENCES core.receipt(id) ON DELETE CASCADE,
                enqueued_at  TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                leased_at    TIMESTAMPTZ,
                lease_until  TIMESTAMPTZ,
                attempts     SMALLINT NOT NULL DEFAULT 0,
                processed_at TIMESTAMPTZ,
                model        VARCHAR(100),
                raw_text     TEXT,
                extraction   JSONB,
                last_error   VARCHAR(500)
              );
              CREATE INDEX idx_receipt_job_pending ON ai.receipt_job (enqueued_at)
                WHERE processed_at IS NULL;
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS ai.receipt_job;
