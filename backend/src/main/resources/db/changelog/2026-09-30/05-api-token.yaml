# 05-api-token.yaml — strojové tokeny (docs/ai.md, „Účtenky" → „Autentizace workeru").
#
# Worker na domácím PC není člověk a nemá mít app_user — kdyby běžel pod účtem, zdědil by
# i všechno, co účet smí (zápis cen, recenze), a jeho identita by se míchala do reputace.
# Token má úzký scope, v DB je jen SHA-256 (token sám je 256 bitů náhody, pomalý hash typu
# Argon2 by tu nic nepřidal a zdržoval by každý request), prefix kcw_ ho odliší od JWT.
databaseChangeLog:
  - changeSet:
      id: 2026-09-30-05-api-token
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE TABLE auth.api_token (
                id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name         VARCHAR(100) NOT NULL,
                token_hash   BYTEA NOT NULL UNIQUE,
                scope        VARCHAR(20) NOT NULL,
                created_at   TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                last_used_at TIMESTAMPTZ,
                revoked_at   TIMESTAMPTZ,
                CONSTRAINT chk_api_token_scope CHECK (scope IN ('RECEIPT_WORKER'))
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS auth.api_token;
