# 01-receipt-item.yaml — zveřejnění všech položek účtenky i bez spárování („zboží z účtenky",
# docs/datovy-model.md, „Účtenky"; docs/reputace.md, „Zboží z účtenky").
#
# Zboží z účtenky NENÍ nová entita: je to bezkódová druhová položka (is_generic, rozsah
# CHAIN/STORE, DRAFT do potvrzení) se značkou původu created_via = 'RECEIPT'. Díky tomu
# hledání, agregáty, grafy i sloučení (ProductMergeService) fungují beze změny.
#
# core.receipt.sum_status je kontrolní součet workeru (součet položek proti vytištěnému
# „Celkem", tools/uctenky/parse.py) — řídí jen předvýběr řádků v klientovi, nic nezakazuje.
# Starší účtenky ho dostanou z uloženého ai.receipt_job.extraction.
#
# core.product_merge_vote: hlas „tohle zboží z účtenky je ve skutečnosti tamto zboží".
# Sloučení cizích cen proběhne až po app.receipt.item-merge-confirmations různých hlasech
# pro stejný cíl. user_id se po 180 dnech nuluje (PseudonymizationService), hlas zůstává.
databaseChangeLog:
  - changeSet:
      id: 2026-11-05-01-product-created-via
      author: Petr F.
      changes:
        - sql:
            sql: |
              ALTER TABLE core.product ADD COLUMN created_via VARCHAR(10) NOT NULL DEFAULT 'USER';
              ALTER TABLE core.product ADD CONSTRAINT chk_product_created_via
                CHECK (created_via IN ('USER', 'RECEIPT'));
              -- Strop otevřených položek z účtenek na účet (ProductCatalogService.createReceiptItem).
              CREATE INDEX idx_product_receipt_item_draft ON core.product (created_by_user_id)
                WHERE created_via = 'RECEIPT' AND status = 'DRAFT';
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS core.idx_product_receipt_item_draft;
              ALTER TABLE core.product DROP CONSTRAINT IF EXISTS chk_product_created_via;
              ALTER TABLE core.product DROP COLUMN IF EXISTS created_via;

  - changeSet:
      id: 2026-11-05-01-receipt-line-receipt-item
      author: Petr F.
      changes:
        - sql:
            sql: |
              ALTER TABLE core.receipt_line DROP CONSTRAINT chk_receipt_line_match_source;
              ALTER TABLE core.receipt_line ADD CONSTRAINT chk_receipt_line_match_source CHECK (match_source IS NULL
                OR match_source IN ('CODE','LABEL','FUZZY','OFF','USER','NEW_PRODUCT','RECEIPT_ITEM'));
      rollback:
        - sql:
            sql: |
              UPDATE core.receipt_line SET match_source = 'NEW_PRODUCT' WHERE match_source = 'RECEIPT_ITEM';
              ALTER TABLE core.receipt_line DROP CONSTRAINT chk_receipt_line_match_source;
              ALTER TABLE core.receipt_line ADD CONSTRAINT chk_receipt_line_match_source CHECK (match_source IS NULL
                OR match_source IN ('CODE','LABEL','FUZZY','OFF','USER','NEW_PRODUCT'));

  - changeSet:
      id: 2026-11-05-01-receipt-sum-status
      author: Petr F.
      changes:
        - sql:
            sql: |
              ALTER TABLE core.receipt ADD COLUMN sum_status VARCHAR(10) NOT NULL DEFAULT 'UNKNOWN';
              ALTER TABLE core.receipt ADD COLUMN computed_total NUMERIC(10,2);
              ALTER TABLE core.receipt ADD CONSTRAINT chk_receipt_sum_status
                CHECK (sum_status IN ('MATCH', 'MISMATCH', 'UNKNOWN'));
              UPDATE core.receipt r SET
                  sum_status = CASE
                    WHEN j.extraction ->> 'printedTotal' IS NULL THEN 'UNKNOWN'
                    WHEN (j.extraction ->> 'totalMatches')::boolean THEN 'MATCH'
                    ELSE 'MISMATCH' END,
                  computed_total = CASE WHEN j.extraction ->> 'computedTotal' ~ '^-?[0-9]+(\.[0-9]+)?$'
                    THEN (j.extraction ->> 'computedTotal')::numeric(10,2) END
                FROM ai.receipt_job j
               WHERE j.receipt_id = r.id
                 AND r.processing_status = 'PROCESSED'
                 AND jsonb_typeof(j.extraction) = 'object'
                 AND j.extraction -> 'totalMatches' IS NOT NULL;
      rollback:
        - sql:
            sql: |
              ALTER TABLE core.receipt DROP CONSTRAINT IF EXISTS chk_receipt_sum_status;
              ALTER TABLE core.receipt DROP COLUMN IF EXISTS computed_total;
              ALTER TABLE core.receipt DROP COLUMN IF EXISTS sum_status;

  - changeSet:
      id: 2026-11-05-01-product-merge-vote
      author: Petr F.
      changes:
        - sql:
            sql: |
              CREATE TABLE core.product_merge_vote (
                id                BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                source_product_id BIGINT NOT NULL REFERENCES core.product(id) ON DELETE CASCADE,
                target_product_id BIGINT NOT NULL REFERENCES core.product(id) ON DELETE CASCADE,
                user_id           BIGINT REFERENCES auth.app_user(id) ON DELETE SET NULL,
                created_at        TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT chk_product_merge_vote_distinct CHECK (source_product_id <> target_product_id)
              );
              -- Jeden účet jeden hlas na zboží z účtenky; změna názoru hlas přepíše.
              CREATE UNIQUE INDEX uq_product_merge_vote_user ON core.product_merge_vote (source_product_id, user_id)
                WHERE user_id IS NOT NULL;
              CREATE INDEX idx_product_merge_vote_target ON core.product_merge_vote (target_product_id);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS core.product_merge_vote;

  - changeSet:
      id: 2026-11-05-01-category-uncategorized
      author: Petr F.
      comment: Záchytná kategorie pro zboží z účtenky, kterému nikdo kategorii nenavrhl.
      changes:
        - sql:
            sql: |
              INSERT INTO core.category (slug, name, path, sort_order, parent_id)
              VALUES ('nezarazeno', 'Nezařazeno', 'nezarazeno', 90, NULL)
              ON CONFLICT (slug) DO NOTHING;
              INSERT INTO core.category_i18n (category_id, locale, name)
              SELECT c.id, v.locale, v.name
                FROM core.category c
                CROSS JOIN (VALUES ('sk', 'Nezaradené'), ('en', 'Uncategorized'),
                                   ('pl', 'Bez kategorii'), ('de', 'Nicht zugeordnet')) AS v(locale, name)
               WHERE c.slug = 'nezarazeno'
              ON CONFLICT DO NOTHING;
      rollback:
        - sql:
            sql: |
              DELETE FROM core.category_i18n WHERE category_id = (SELECT id FROM core.category WHERE slug = 'nezarazeno');
              DELETE FROM core.category WHERE slug = 'nezarazeno'
                AND NOT EXISTS (SELECT 1 FROM core.product p WHERE p.category_id = core.category.id);
