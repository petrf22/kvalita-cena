# 03-retail-chain-seed.yaml — číselník řetězců pro našeptávání při zakládání obchodu
# (docs/stav-implementace.md, "výběr řetězce při zakládání obchodu"). Dvě samostatné změny:
#
# 1) core.retail_chain.slug měl unikát jen přes slug samotný (2026-07-26/02-stores.yaml) — u
#    cíle 16 zemí (docs/lokalizace.md) by to znamenalo buď zemi zakódovanou ve slugu
#    ("lidl-cz", "lidl-sk"), nebo kolizi při zakládání stejné značky ve druhé zemi. Přechod na
#    unikát (country, slug), stejný vzor jako u uq_store_identity v
#    2026-08-16/01-store-country.yaml — DROP starého, CREATE nového, ne editace historického
#    changesetu (tabulka byla v produkci prázdná, ale checksum už proběhlého changesetu se
#    stejně nemá měnit).
#
# 2) Ruční seed značek působících v ČR. Vzor 2026-08-19/01-category-seed.yaml (prostý INSERT,
#    ne staging tabulka + CSV z 2026-08-20/01-category-tree.yaml — na ~35 řádků je to
#    zbytečné, ten vzor si nech pro rozšíření na další země). Jde o kurátorský číselník
#    značek, ne o import poboček — viz docs/nasazeni.md, "Katalog obchodů se záměrně
#    nepředvyplňuje" a odůvodnění tamtéž, proč se to na tenhle seed nevztahuje. Ověřeno proti
#    https://github.com/osmlab/name-suggestion-index (BSD-3-Clause, ne ODbL).
databaseChangeLog:
  - changeSet:
      id: 2026-08-29-03-retail-chain-country-slug-unique
      author: Petr F.
      changes:
        - sql:
            sql: |
              ALTER TABLE core.retail_chain DROP CONSTRAINT retail_chain_slug_key;
              ALTER TABLE core.retail_chain ADD CONSTRAINT uq_retail_chain_country_slug UNIQUE (country, slug);
      rollback:
        - sql:
            sql: |
              ALTER TABLE core.retail_chain DROP CONSTRAINT uq_retail_chain_country_slug;
              ALTER TABLE core.retail_chain ADD CONSTRAINT retail_chain_slug_key UNIQUE (slug);

