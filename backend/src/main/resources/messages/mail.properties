# OTP e-mail (SmtpOtpMailSender) — jazyk podle app_user.locale (existující účet) nebo
# Accept-Language (nový uživatel, viz OtpService.requestOtp). {1} = platnost v minutách,
# MessageFormat "choice" řeší plurál (1 minutu / 2-4 minuty / 5+ minut) bez další knihovny —
# hodnota se čte z OtpProperties.codeTtl, ne natvrdo (dřív bylo natvrdo "10 minut", i když
# konfigurace mohla být jiná).
mail.otp.subject=Přihlašovací kód — Kvalita a cena
mail.otp.body=Tvůj přihlašovací kód je: {0}\n\nKód platí {1,choice,0#{1} minut|1#{1} minutu|2#{1} minuty|5#{1} minut}. Pokud sis o něj nežádal(a), tuto zprávu ignoruj.

# Změna přihlašovacího e-mailu (EmailChangeService) — kód jde na NOVOU adresu. Když je nová
# adresa už u jiného účtu obsazená, místo kódu se pošle jen upozornění (docs/soukromi.md) —
# tuhle informaci tak dostane jen ten, kdo do dané schránky skutečně vidí.
mail.emailChange.subject=Změna přihlašovacího e-mailu — Kvalita a cena
mail.emailChange.body=Tvůj kód pro potvrzení nové přihlašovací adresy je: {0}\n\nKód platí {1,choice,0#{1} minut|1#{1} minutu|2#{1} minuty|5#{1} minut}. Pokud sis o něj nežádal(a), tuto zprávu ignoruj.
mail.emailChange.conflictSubject=Pokus o změnu e-mailu — Kvalita a cena
mail.emailChange.conflictBody=Někdo se pokusil nastavit tuhle e-mailovou adresu jako přihlašovací u jiného účtu Kvalita a cena. Tvůj účet zůstává beze změny. Pokud jsi to nebyl(a) ty, tuto zprávu ignoruj.
