# OTP e-mail (SmtpOtpMailSender) — jazyk podle app_user.locale (existující účet) nebo
# Accept-Language (nový uživatel, viz OtpService.requestOtp). {1} = platnost v minutách,
# MessageFormat "choice" řeší plurál (1 minutu / 2-4 minuty / 5+ minut) bez další knihovny —
# hodnota se čte z OtpProperties.codeTtl, ne natvrdo (dřív bylo natvrdo "10 minut", i když
# konfigurace mohla být jiná).
mail.otp.subject=Přihlašovací kód — Kvalita a cena
mail.otp.body=Tvůj přihlašovací kód je: {0}\n\nKód platí {1,choice,0#{1} minut|1#{1} minutu|2#{1} minuty|5#{1} minut}. Pokud sis o něj nežádal(a), tuto zprávu ignoruj.
