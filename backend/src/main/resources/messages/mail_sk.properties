mail.otp.subject=Prihlasovací kód — Kvalita a cena
mail.otp.body=Tvoj prihlasovací kód je: {0}\n\nKód platí {1,choice,0#{1} minút|1#{1} minútu|2#{1} minúty|5#{1} minút}. Ak si oň nežiadal(a), túto správu ignoruj.

