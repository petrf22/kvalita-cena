mail.emailChange.body=Tvoj kód na potvrdenie novej prihlasovacej adresy je: {0}\n\nKód platí {1,choice,0#{1} minút|1#{1} minútu|2#{1} minúty|5#{1} minút}. Ak si oň nežiadal(a), túto správu ignoruj.
mail.emailChange.conflictSubject=Pokus o zmenu e-mailu — Kvalita a cena
mail.emailChange.conflictBody=Niekto sa pokúsil nastaviť túto e-mailovú adresu ako prihlasovaciu pri inom účte Kvalita a cena. Tvoj účet zostáva bez zmeny. Ak si to nebol(a) ty, túto správu ignoruj.

mail.accountDelete.subject=Potvrdenie výmazu účtu — Kvalita a cena
