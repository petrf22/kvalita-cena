plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cz.kvalitacena'
version = '0.0.1-SNAPSHOT'
description = 'Kvalita a cena — komunitní sledování cen zboží'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // graphql-java-extended-scalars zatím nemá release kompatibilní s graphql-java 25 (viz
    // Spring Boot 4 / spring-boot-graphql) — vlastní scalary jsou v config/GraphQlScalars.java.

    // Cache reputačních skóre a throttlingu (in-memory, Apache-2.0 — bez Bucket4j kvůli jeho
    // komerční licenci na části modulů).
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Passwordless auth — JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Argon2PasswordEncoder (Spring Security) potřebuje na classpath Bouncy Castle
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.language', 'cs'
    systemProperty 'user.country', 'CZ'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'Europe/Prague'
}
