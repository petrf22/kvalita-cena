plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cz.kvalitacena'
// Generováno tools/version/sync.mjs z kořenového VERSION — needituj ručně.
version = '0.7.0'
description = 'Kvalita a cena — komunitní sledování cen zboží'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Vystaví verzi (a commit, je-li build spuštěn s GIT_SHA v prostředí — viz backend/Dockerfile,
// compose.prod.yaml) na dnes prázdném /actuator/info (permitAll, SecurityConfig), viz
// docs/vydani.md, "Verzování a vydání". GIT_SHA chybí lokálnímu `./gradlew bootRun` i CI
// buildu — pole je pak prázdné, ne chybějící.
springBoot {
    buildInfo {
        properties {
            additional = [
                    'commit': (System.getenv('GIT_SHA') ?: '')
            ]
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // graphql-java-extended-scalars zatím nemá release kompatibilní s graphql-java 25 (viz
    // Spring Boot 4 / spring-boot-graphql) — vlastní scalary jsou v config/GraphQlScalars.java.

    // Cache reputačních skóre a throttlingu (in-memory, Apache-2.0 — bez Bucket4j kvůli jeho
    // komerční licenci na části modulů).
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Passwordless auth — JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Argon2PasswordEncoder (Spring Security) potřebuje na classpath Bouncy Castle
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'

    // Čtení EXIF orientace nahraných fotek (ImageProcessingService) — Apache-2.0. Vlastní
    // parser APP1 segmentu je klasické místo na chyby, tohle je pro to standardní knihovna.
    implementation 'com.drewnoakes:metadata-extractor:2.21.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Jediné místo, kde appka nastartuje celý Spring kontext proti reálné DB (viz
    // ApplicationSmokeTest) — ostatních 22+ tříd testuje bez Springu, takže Liquibase vs.
    // ddl-auto=validate, GraphQL wiring a autorizace v SecurityConfig se jinde neověří.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Spring Boot 4.1.0 (velmi čerstvý) zatím dependency-management BOM verzi Testcontainers
    // neřídí — verze proto natvrdo tady, ne přes BOM jako ostatní závislosti v tomhle souboru.
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'user.language', 'cs'
    systemProperty 'user.country', 'CZ'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'Europe/Prague'
}
