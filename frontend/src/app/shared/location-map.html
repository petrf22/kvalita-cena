@if (!loaded()) {
  <button nz-button type="button" [nzLoading]="loading()" (click)="show()">
    <span nz-icon nzType="environment"></span>
    {{ 'common.showMap' | transloco }}
  </button>
} @else {
  <div #mapContainer class="map-container"></div>
  @if (editable()) {
    <p class="map-hint">{{ 'common.mapHint' | transloco }}</p>
  }
}
