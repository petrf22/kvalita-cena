<ng-container *transloco="let t; scope: 'settings'">
  <h1>{{ t('settings.title') }}</h1>

  <form nz-form nzLayout="vertical">
    <nz-form-item>
      <nz-form-label>{{ t('settings.languageLabel') }}</nz-form-label>
      <nz-form-control>
        <nz-select
          [ngModel]="language.lang()"
          (ngModelChange)="onLanguageChange($event)"
          name="language"
          style="width: 200px"
        >
          @for (option of languageOptions; track option.value) {
            <nz-option [nzValue]="option.value" [nzLabel]="option.label" />
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </form>

  <nz-card [nzTitle]="t('settings.sourcesTitle')" class="sources-card">
    <p>{{ t('settings.sourcesText') }}</p>
    <p class="sources-note">{{ t('settings.sourcesNote') }}</p>
  </nz-card>

  <p class="app-version">{{ t('settings.appVersionLabel', { version: appVersion }) }}</p>
</ng-container>
