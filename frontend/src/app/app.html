<nz-layout class="app-layout">
  <nz-header class="app-header">
    <a routerLink="/" class="app-title">Kvalita a cena</a>
    <div class="app-header-actions">
      @if (auth.isLoggedIn()) {
        <button nz-button nzType="text" (click)="logout()">Odhlásit se</button>
      } @else {
        <a routerLink="/prihlaseni">
          <button nz-button nzType="primary">Přihlásit se</button>
        </a>
      }
    </div>
  </nz-header>
  <nz-content class="app-content">
    <router-outlet />
  </nz-content>
</nz-layout>
