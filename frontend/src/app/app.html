<nz-layout class="app-layout">
  <nz-header class="app-header">
    <a routerLink="/" class="app-title">Kvalita a cena</a>
    <ul nz-menu nzMode="horizontal" nzTheme="light" class="app-menu">
      <li
        nz-menu-item
        routerLink="/"
        routerLinkActive="ant-menu-item-selected"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span nz-icon nzType="search"></span>
        <span class="app-menu-label">{{ 'nav.search' | transloco }}</span>
      </li>
      <li nz-menu-item routerLink="/price" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="plus-circle"></span>
        <span class="app-menu-label">{{ 'nav.price' | transloco }}</span>
      </li>
      <li nz-menu-item routerLink="/settings" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="setting"></span>
        <span class="app-menu-label">{{ 'nav.settings' | transloco }}</span>
      </li>
      <li nz-menu-item routerLink="/login" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="user"></span>
        <span class="app-menu-label">{{ (auth.isLoggedIn() ? 'nav.account' : 'nav.login') | transloco }}</span>
      </li>
    </ul>
  </nz-header>
  <nz-content class="app-content">
    <router-outlet />
  </nz-content>
</nz-layout>
