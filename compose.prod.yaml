# Produkční nasazení (docs/vydani.md — "Neexistuje produkční backend"), na rozdíl od
# compose.yaml v kořeni repa, který je jen dev Postgres pro spring-boot-docker-compose.
#
# Proměnné (POSTGRES_USER/PASSWORD, JWT_SECRET, ...) čte Docker Compose ze souboru `.env` ve
# stejném adresáři (viz .env.example) — `.env` samotný je v .gitignore, nikdy se necommituje.
#
# Named volumes mají suffix "-prod" schválně — oba compose soubory leží ve stejném adresáři,
# takže mají stejné výchozí jméno Compose projektu (`kvalita-cena`); bez odlišení by tenhle
# soubor spolknul (nebo přepsal) volume dev DB z compose.yaml, jen podle shodného klíče.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kvalitaacena
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - kvalita-a-cena-postgres-data-prod:/var/lib/postgresql/data
    # Žádné `ports:` — na rozdíl od dev compose.yaml tu Postgres nemá být dostupný z hostitele,
    # jen z backend kontejneru přes interní síť compose.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d kvalitaacena']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # "prod,beta" během uzavřené bety (docs/nasazeni.md, application-beta.yml) — nastavit
      # v .env, ne tady, ať se přepínání neděje editací tohohle souboru.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # Jméno služby, ne localhost — appka běží v kontejneru vedle Postgresu, ne na hostiteli.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kvalitaacena
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MEDIA_ROOT=/data/media
    volumes:
      # Fotky leží mimo databázi (docs/datovy-model.md) — zálohuje se nezávisle na pg_dump.
      - kvalita-a-cena-media-prod:/data/media
    depends_on:
      postgres:
        # Bez tohohle appka na prvním startu nejspíš zkusí připojit dřív, než Postgres skutečně
        # přijímá spojení, a spadne — `restart: unless-stopped` ji sice znovu zvedne, ale logy
        # z prvního pokusu pak vypadají jako chyba, kterou nejsou.
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
      # api.kvalitacena.cz — vlastní site blok v Caddyfile, jinak by mobilní release build
      # (mobile/app/build.gradle.kts) neměl kam mluvit.
      - API_ADDRESS=${API_ADDRESS:-http://api.localhost}
      # Všechny tři nepovinné, prázdný default nechává Caddyfile na jeho vlastních defaultech
      # (viz komentáře tam) — appka bez nich funguje stejně jako dřív.
      - WWW_ADDRESS=${WWW_ADDRESS:-http://www.localhost}
      - ACME_EMAIL=${ACME_EMAIL:-kontakt@kvalitacena.cz}
      - ACME_CA=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Certifikáty/stav Let's Encrypt musí přežít restart kontejneru, jinak si Caddy vyžádá
      # nový certifikát při každém nasazení a narazí na rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

# `name:` u kvalita-a-cena-media-prod napevno vypíná automatický prefix podle jména Compose
# projektu (odvozený z názvu adresáře, viz komentář nahoře) — bez něj `ops/backup.sh` (holé
# jméno v proměnné MEDIA_VOLUME) čte/zálohuje JINOU volume, než do které appka skutečně
# zapisuje. Objeveno 2026-08-24 při zkoušce obnovy: `docker volume ls` ukázal dvojici
# `kvalita-a-cena-media-prod` (prázdná, omylem založená bez prefixu diagnostickým příkazem) a
# `kvalita-cena_kvalita-a-cena-media-prod` (skutečná, s nahranou fotkou) vedle sebe — zálohy
# fotek tak byly od začátku prázdné, i když skript "úspěšně" doběhl. Postgres/Caddy volumes níž
# mají teoreticky stejné riziko (jiný název adresáře repa = jiný prefix = appka by "začala
# nanovo" s prázdnou volume), ale nic je dnes nečte podle holého jména jako `ops/backup.sh`
# médium — proto zůstávají bez `name:`, ať se nemusí migrovat běžící produkční databáze a TLS
# certifikáty jen kvůli teoretickému riziku. Pokud by na ně někdy vzniklo podobné venkovní
# odkazování, patří sem stejná oprava.
volumes:
  kvalita-a-cena-postgres-data-prod:
  kvalita-a-cena-media-prod:
    name: kvalita-a-cena-media-prod
  caddy-data:
  caddy-config:
